   ${CLAUDE_PLUGIN_ROOT}/skills/subdomain-enumeration/scripts/subdomain-enum.sh --domain TARGET_TOKEN \
     --output "$SESSION_DIR/recon/subdomain_enum_TARGET_TOKEN.json"
